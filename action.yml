name: AI Lean Check
description: Generate Lean 4 verification files with a coding agent and compile them independently.
author: eyalk11

branding:
  icon: check-circle
  color: purple

inputs:
  provider:
    description: Coding agent. One of claude-code or codex.
    required: false
    default: claude-code
  model:
    description: Provider model ID. Empty selects a provider-specific default.
    required: false
    default: ""
  source-paths:
    description: Deprecated and ignored; the coding agent inspects the Git diff directly.
    required: false
    default: ""
  context-files:
    description: Deprecated and ignored; the coding agent reads repository files directly.
    required: false
    default: ""
  imports:
    description: Newline-separated Lean modules the generated file should import.
    required: false
    default: ""
  task:
    description: Additional instructions describing the verification check to generate.
    required: false
    default: Generate meaningful compile-time checks for the changed Lean declarations.
  max-repair-attempts:
    description: Number of repair calls after the initial generation attempt.
    required: false
    default: "2"
  agent-max-turns:
    description: Maximum Claude Code turns in coding-agent mode.
    required: false
    default: "20"
  output-file:
    description: Legacy optional single target file. Empty lets the agent choose project filenames.
    required: false
    default: ""
  target-files:
    description: Optional newline-separated Lean files to request. Empty lets the agent choose; additions are discovered through Git diff.
    required: false
    default: ""
  verification-command:
    description: Optional additional shell command run after mandatory Lean checks with provider and GitHub credentials removed.
    required: false
    default: ""
  setup-lean:
    description: Whether to install the caller project's Lean toolchain.
    required: false
    default: "true"
  build-project:
    description: Whether lean-action should run lake build before generating the check.
    required: false
    default: "true"
  use-mathlib-cache:
    description: Passed to leanprover/lean-action.
    required: false
    default: auto
  upload-artifact:
    description: Upload the generated source and diagnostic log.
    required: false
    default: "true"
  artifact-name:
    description: Name of the generated-files and diagnostics artifact.
    required: false
    default: ai-lean-check
  base-sha:
    description: Base commit for the pull-request diff. Defaults to the pull-request base SHA.
    required: false
    default: ""
  head-sha:
    description: Head commit for the pull-request diff. Defaults to the checked-out commit.
    required: false
    default: ""
  max-context-bytes:
    description: Deprecated and ignored.
    required: false
    default: "200000"
  max-input-tokens:
    description: Deprecated and ignored in coding-agent mode.
    required: false
    default: "50000"
  max-output-tokens:
    description: Maximum output tokens requested from the provider per attempt.
    required: false
    default: "32768"
  deps-sorry-policy:
    description: Handling of sorry/admit inside designated dependency files. One of warn or reject.
    required: false
    default: warn
  axiom-policy:
    description: |
      Audit of which generated declarations transitively depend on sorryAx.
      One of warn, reject or off. The sorry-allowed-files policy is file-based
      and cannot see that a policy-clean theorem imports a sorry-carrying lemma;
      this asks Lean instead, at declaration granularity.
    required: false
    default: warn
  sorry-allowed-files:
    description: Newline-separated dependency file globs where baseline assumptions may use sorry/admit.
    required: false
    default: "**/*_deps.lean"

outputs:
  generated-file:
    description: First generated Lean file, for compatibility.
    value: ${{ steps.verify-agent.outputs.generated-file }}
  generated-files:
    description: Newline-separated generated Lean files discovered from Git.
    value: ${{ steps.verify-agent.outputs.generated-files }}
  attempts:
    description: Reserved for compatibility; coding-agent providers manage their own turns.
    value: ${{ steps.verify-agent.outputs.attempts }}

runs:
  using: composite
  steps:
    - name: Set up and build Lean project
      if: inputs.setup-lean == 'true'
      uses: leanprover/lean-action@v1
      with:
        auto-config: false
        build: ${{ inputs.build-project }}
        test: false
        lint: false
        use-mathlib-cache: ${{ inputs.use-mathlib-cache }}

    - name: Validate coding-agent provider
      shell: bash
      run: |
        case "${{ inputs.provider }}" in
          claude-code|codex) ;;
          *) echo "::error::provider must be 'claude-code' or 'codex'"; exit 1 ;;
        esac

    - name: Prepare coding-agent task
      id: prepare-agent
      shell: bash
      env:
        AI_LEAN_IMPORTS: ${{ inputs.imports }}
        AI_LEAN_TASK: ${{ inputs.task }}
        AI_LEAN_OUTPUT_FILE: ${{ inputs.output-file }}
        AI_LEAN_TARGET_FILES: ${{ inputs.target-files }}
        AI_LEAN_BASE_SHA: ${{ inputs.base-sha }}
        AI_LEAN_HEAD_SHA: ${{ inputs.head-sha }}
        AI_LEAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        AI_LEAN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        AI_LEAN_DEPS_SORRY_POLICY: ${{ inputs.deps-sorry-policy }}
        AI_LEAN_SORRY_ALLOWED_FILES: ${{ inputs.sorry-allowed-files }}
        AI_LEAN_AXIOM_POLICY: ${{ inputs.axiom-policy }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/prepare_agent.py"

    - name: Generate and test with Claude Code
      id: claude-agent
      if: inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true'
      uses: anthropics/claude-code-base-action@beta
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
      with:
        claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        prompt_file: .ai-lean-check/agent-prompt.md
        model: ${{ inputs.model || 'claude-sonnet-4-6' }}
        max_turns: ${{ inputs.agent-max-turns }}
        timeout_minutes: "30"
        allowed_tools: Read,Glob,Grep,Write,Edit,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git rev-parse:*),Bash(.ai-lean-check/run-lean-sanitized.sh:*)

    - name: Capture Claude diagnostics
      if: always() && inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true'
      shell: bash
      env:
        CLAUDE_CONCLUSION: ${{ steps.claude-agent.outputs.conclusion }}
        CLAUDE_EXECUTION_FILE: ${{ steps.claude-agent.outputs.execution_file }}
        CLAUDE_OUTCOME: ${{ steps.claude-agent.outcome }}
      run: |
        mkdir -p .ai-lean-check
        {
          echo "step_outcome=${CLAUDE_OUTCOME:-unknown}"
          echo "conclusion=${CLAUDE_CONCLUSION:-unknown}"
          echo "execution_file=${CLAUDE_EXECUTION_FILE:-}"
        } > .ai-lean-check/claude-summary.txt
        if [ -n "${CLAUDE_EXECUTION_FILE:-}" ] && [ -f "$CLAUDE_EXECUTION_FILE" ]; then
          cp "$CLAUDE_EXECUTION_FILE" .ai-lean-check/claude-execution.json
          echo "--- execution tail ---" >> .ai-lean-check/claude-summary.txt
          tail -c 16000 "$CLAUDE_EXECUTION_FILE" >> .ai-lean-check/claude-summary.txt
          printf '\n' >> .ai-lean-check/claude-summary.txt
        fi
        cat .ai-lean-check/claude-summary.txt

    - name: Generate and test with Codex
      if: inputs.provider == 'codex' && steps.prepare-agent.outputs.should-run == 'true'
      uses: openai/codex-action@v1
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
      with:
        openai-api-key: ${{ env.OPENAI_API_KEY }}
        prompt-file: .ai-lean-check/agent-prompt.md
        output-file: .ai-lean-check/codex-final.txt
        model: ${{ inputs.model }}
        sandbox: workspace-write
        safety-strategy: drop-sudo

    - name: Independently verify coding-agent result
      id: verify-agent
      if: steps.prepare-agent.outputs.should-run == 'true' && (inputs.provider == 'codex' || steps.claude-agent.outcome == 'success')
      shell: bash
      env:
        AI_LEAN_OUTPUT_FILE: ${{ inputs.output-file }}
        AI_LEAN_TARGET_FILES: ${{ inputs.target-files }}
        AI_LEAN_IMPORTS: ${{ inputs.imports }}
        AI_LEAN_VERIFICATION_COMMAND: ${{ inputs.verification-command }}
        AI_LEAN_AXIOM_POLICY: ${{ inputs.axiom-policy }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/verify_agent.py"

    - name: Upload generated Lean check
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.verify-agent.outputs.generated-files }}
          .ai-lean-check/diagnostics.txt
          .ai-lean-check/agent-prompt.md
          .ai-lean-check/claude-summary.txt
          .ai-lean-check/claude-execution.json
          .ai-lean-check/codex-final.txt
          .ai-lean-check/check-files.txt
          .ai-lean-check/run-lean-sanitized.sh
        if-no-files-found: warn
        include-hidden-files: true

    - name: Fail when Claude failed
      if: inputs.provider == 'claude-code' && steps.prepare-agent.outputs.should-run == 'true' && steps.claude-agent.outcome != 'success'
      shell: bash
      run: |
        cat .ai-lean-check/claude-summary.txt || true
        exit 1
