name: Lean example

on:
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - "proofs/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - "action.yml"
      - "scripts/**"
      - ".github/workflows/lean-example.yml"
  pull_request:
    paths:
      - "**/*.lean"
      - "proofs/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - "action.yml"
      - "scripts/**"
      - ".github/workflows/lean-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate and verify a Lean check
        uses: ./
        with:
          provider: claude-code
          model: claude-sonnet-4-6
          base-sha: ${{ github.event.before || github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          head-sha: ${{ github.sha }}
          source-paths: |
            proofs/*.md
          context-files: |
            Simple.lean
            proofs/*.md
            lakefile.toml
            lean-toolchain
          imports: |
            Simple
          task: |
            Formalize the changed human-language theorem and proof as a Lean
            theorem. Keep the formalization faithful to the stated claim.
          deps-sorry-policy: reject
          max-input-tokens: "10000"
          max-output-tokens: "8192"
          max-repair-attempts: "1"
          verification-command: |
            test -z "${ANTHROPIC_API_KEY:-}"
            test -z "${GITHUB_TOKEN:-}"
            test -z "${GH_TOKEN:-}"
            test -z "${ACTIONS_RUNTIME_TOKEN:-}"
            test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
            test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
            ! git config --local --get-all http.https://github.com/.extraheader
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_KEY }}
