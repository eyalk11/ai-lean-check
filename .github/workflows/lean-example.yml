name: Lean example

on:
  push:
    branches: [main]
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - "action.yml"
      - "scripts/**"
      - ".github/workflows/lean-example.yml"
  pull_request:
    paths:
      - "**/*.lean"
      - "lakefile.toml"
      - "lean-toolchain"
      - "action.yml"
      - "scripts/**"
      - ".github/workflows/lean-example.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-check:
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Generate and verify a Lean check
        uses: ./
        with:
          provider: claude-code
          base-sha: ${{ github.event.before || github.event.pull_request.base.sha || format('{0}^', github.sha) }}
          head-sha: ${{ github.sha }}
          source-paths: |
            Simple.lean
          context-files: |
            Simple.lean
            lakefile.toml
            lean-toolchain
          imports: |
            Simple
          task: |
            Generate small examples that exercise
            Simple.add_zero, Simple.add_one, and Simple.two_plus_two.
          deps-sorry-policy: reject
          max-input-tokens: "10000"
          max-output-tokens: "8192"
          max-repair-attempts: "1"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_KEY }}
